name: Deploy 9naŭ
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest,ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}

      - name: Build and Push App
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/app/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/app:latest,ghcr.io/${{ github.repository }}/app:${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.9nau.com
            NEXT_PUBLIC_ACCOUNTS_URL=https://accounts.9nau.com
            NEXT_PUBLIC_APP_URL=https://app.9nau.com

      - name: Build and Push Accounts
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/accounts/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/accounts:latest,ghcr.io/${{ github.repository }}/accounts:${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.9nau.com
            NEXT_PUBLIC_ACCOUNTS_URL=https://accounts.9nau.com
            NEXT_PUBLIC_APP_URL=https://app.9nau.com

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'docker-compose.yml'
          target: '/root/9nau/'

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p /root/9nau

            # Login to GHCR to pull private images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Write production .env from secrets
            cat > /root/9nau/.env.tmp << 'ENVEOF'
            DATABASE_URL=postgresql://postgres:${{ secrets.DATABASE_PASSWORD }}@9nau-postgres:5432/9nau?schema=public
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            NAU_SERVICE_KEY=${{ secrets.NAU_SERVICE_KEY }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            NAUTHENTICITY_URL=http://nauthenticity:3000
            WHATSNAU_URL=http://whatsnau-app-1:3000
            FRONTEND_URL=https://9nau.com
            NEXT_PUBLIC_API_URL=https://api.9nau.com
            NEXT_PUBLIC_ACCOUNTS_URL=https://accounts.9nau.com
            NEXT_PUBLIC_APP_URL=https://app.9nau.com
            TAG=latest
            ENVEOF
            sed 's/^[[:space:]]*//' /root/9nau/.env.tmp | tr -d '\r' > /root/9nau/.env

            cd /root/9nau
            echo "--- Server Disk Space [BEFORE SWAP] ---"
            df -h /
            
            # Prune previous dangling images (older than 2h) to clear runway for pull
            docker image prune -a -f --filter "until=2h" || true

            # Pull and deploy
            TAG=latest docker compose pull
            TAG=latest docker compose up -d --remove-orphans
            
            # Prune old images
            docker image prune -a -f --filter "until=2h" || true

            echo "--- Server Disk Space [AFTER SWAP] ---"
            df -h /
