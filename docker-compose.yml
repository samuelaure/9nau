services:
  api:
    image: ghcr.io/samuelaure/9nau/api:${TAG:-latest}
    container_name: 9nau-api
    networks:
      - nau-network
    depends_on:
      - 9nau_postgres
      - 9nau_redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 192M
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - AUTH_SECRET=${AUTH_SECRET}
      - NAU_SERVICE_KEY=${NAU_SERVICE_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - NAUTHENTICITY_URL=${NAUTHENTICITY_URL}
      - WHATSNAU_URL=${WHATSNAU_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_ACCOUNTS_URL=${NEXT_PUBLIC_ACCOUNTS_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FLOWNAU_URL=${FLOWNAU_URL}
      - PORT=3000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.9nau-api.rule=Host(`api.9nau.com`)"
      - "traefik.http.routers.9nau-api.entrypoints=websecure"
      - "traefik.http.routers.9nau-api.tls=true"
      - "traefik.http.routers.9nau-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.9nau-api.loadbalancer.server.port=3000"
      - "traefik.docker.network=nau-network"

  9nau_app:
    image: ghcr.io/samuelaure/9nau/app:${TAG:-latest}
    container_name: 9nau-app
    networks:
      - nau-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_ACCOUNTS_URL=${NEXT_PUBLIC_ACCOUNTS_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.9nau-app.rule=Host(`app.9nau.com`)"
      - "traefik.http.routers.9nau-app.entrypoints=websecure"
      - "traefik.http.routers.9nau-app.tls=true"
      - "traefik.http.routers.9nau-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.9nau-app.loadbalancer.server.port=3000"
      - "traefik.docker.network=nau-network"

  9nau_accounts:
    image: ghcr.io/samuelaure/9nau/accounts:${TAG:-latest}
    container_name: 9nau-accounts
    networks:
      - nau-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_ACCOUNTS_URL=${NEXT_PUBLIC_ACCOUNTS_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.9nau-accounts.rule=Host(`accounts.9nau.com`)"
      - "traefik.http.routers.9nau-accounts.entrypoints=websecure"
      - "traefik.http.routers.9nau-accounts.tls=true"
      - "traefik.http.routers.9nau-accounts.tls.certresolver=letsencrypt"
      - "traefik.http.services.9nau-accounts.loadbalancer.server.port=3000"
      - "traefik.docker.network=nau-network"

  9nau_postgres:
    image: postgres:16
    container_name: 9nau-postgres
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    networks:
      - nau-network
    volumes:
      - 9nau-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 192M

  9nau_redis:
    image: redis:7-alpine
    container_name: 9nau-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - nau-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 192M

networks:
  nau-network:
    external: true

volumes:
  9nau-postgres-data:
