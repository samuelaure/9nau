services:
  api:
    image: ghcr.io/samuelaure/9nau/api:${TAG:-latest}
    container_name: 9nau-api
    networks:
      - nau-network
    depends_on:
      - 9nau_postgres
      - 9nau_redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 192M
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - NAU_SERVICE_KEY=${NAU_SERVICE_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - NAUTHENTICITY_URL=${NAUTHENTICITY_URL}
      - WHATSNAU_URL=${WHATSNAU_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - PORT=3000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.9nau-api.rule=Host(`api.9nau.com`)"
      - "traefik.http.routers.9nau-api.entrypoints=websecure"
      - "traefik.http.routers.9nau-api.tls=true"
      - "traefik.http.routers.9nau-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.9nau-api.loadbalancer.server.port=3000"
      - "traefik.docker.network=nau-network"

  9nau_postgres:
    image: postgres:16
    container_name: 9nau-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    networks:
      - nau-network
    volumes:
      - 9nau-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 192M

  9nau_redis:
    image: redis:7-alpine
    container_name: 9nau-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-nauthenticity_redis_pass}
    networks:
      - nau-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 192M

networks:
  nau-network:
    external: true

volumes:
  9nau-postgres-data:
